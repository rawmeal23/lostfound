<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse Items</title><!-- EDIT: browser tab title (site name is added automatically) -->
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="browse">
<div id="site-header"></div><!-- header is built by js/main.js (logo and name come from js/config.js) -->
<div class="page-head"><div class="container"><h1>Browse Items</h1><p>Search lost and found items on campus.</p></div></div>
<!-- EDIT: page title/subtitle above -->
<section><div class="container">
  <div class="filters">
    <input id="f-q" type="search" placeholder="Search keyword..." aria-label="Keyword"><!-- EDIT: placeholder -->
    <select id="f-type" aria-label="Type"></select><select id="f-cat" aria-label="Category"></select>
    <select id="f-loc" aria-label="Location"></select><select id="f-status" aria-label="Status"></select>
  </div>
  <p class="meta" id="count"></p>
  <div class="grid" id="results"></div><!-- TODO (PHP): results will come from your database -->
</div></section>
<div id="site-footer"></div><!-- footer is built by js/main.js (text comes from js/config.js) -->
<script src="assets/js/config.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
