<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard</title><!-- EDIT: browser tab title (site name is added automatically) -->
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="admin">
<div id="site-header"></div><!-- header is built by js/main.js (logo and name come from js/config.js) -->
<div class="page-head"><div class="container"><h1>Admin Dashboard</h1><p>Review posts and verify claims.</p></div></div>
<!-- EDIT: page title/subtitle above. TODO (PHP): protect this page so only admins can open it -->
<section><div class="container">
  <div class="stats" id="stats"></div>
  <div class="tabs"><button class="tab active" data-tab="posts">Pending Posts</button><button class="tab" data-tab="claims">Pending Claims</button></div>
  <div id="tab-posts" class="scroll"><table><thead><tr><th>Item</th><th>Type</th><th>Posted by</th><th>Date</th><th>Action</th></tr></thead><tbody id="pending-posts"></tbody></table></div>
  <div id="tab-claims" class="hidden scroll"><table><thead><tr><th>Item</th><th>Claimant</th><th>Proof</th><th>Date</th><th>Action</th></tr></thead><tbody id="pending-claims"></tbody></table></div>
</div></section>
<div id="site-footer"></div><!-- footer is built by js/main.js (text comes from js/config.js) -->
<script src="assets/js/config.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
